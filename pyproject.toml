[project]
name = "obsidian-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "arize-phoenix>=12.28.1",
    "langgraph>=1.0.5",
    "openai>=2.38.0",
    "polars>=1.33.1",
    "scipy>=1.17.0",
    "pydantic-settings>=2.7.0",
    "langchain-openai>=1.1.7",
    "langchain>=1.2.7",
    "pyyaml>=6.0.3",
    "loguru>=0.7.3",
    "mcp>=1.6.0",
    "httpx>=0.28.1",
    "pygithub>=2.8.1",
    "langgraph-checkpoint-postgres>=3.0.4",
    "modal>=1.4.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.5.0",
    "json-repair>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic-monty>=0.0.17",
    "wrapt<2",
    "langchain-groq>=1.1.2",
]

[tool.uv]
concurrent-builds = 1
concurrent-downloads = 1
concurrent-installs = 1
compile-bytecode = false

[dependency-groups]
dev = [
    "complexipy>=8.0.1",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.3",
    "marimo>=0.19.7",
    "pre-commit>=4.5.1",
    "pyright>=1.1.409",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

observability = [
    "openinference-instrumentation-langchain>=0.1.58",
    "openinference-instrumentation-mcp>=1.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"] # Added 'I' for isort
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["app/harness", "tests/harness"]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "§9 graphs are not workflows. Graphs do not import the registry, workflows, or the HTTP API. ARCHITECTURE.md §9 and §10."
type = "forbidden"
source_modules = ["app.engine.graphs"]
forbidden_modules = [
    "app.engine.registry",
    "app.engine.workflows",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "§9 tools stay off graphs, nodes, artifact stores, workflows, and the HTTP API. ARCHITECTURE.md §9."
type = "forbidden"
source_modules = ["app.engine.tools"]
forbidden_modules = [
    "app.engine.graphs",
    "app.engine.nodes",
    "app.engine.artifacts",
    "app.engine.workflows",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "§9 backends stay off nodes, graphs, workflows, and the HTTP API. ARCHITECTURE.md §9."
type = "forbidden"
source_modules = ["app.engine.backends"]
forbidden_modules = [
    "app.engine.nodes",
    "app.engine.graphs",
    "app.engine.workflows",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "§9 nodes stay off the HTTP API, the workflow registry, and workflows. ARCHITECTURE.md §9."
type = "forbidden"
source_modules = ["app.engine.nodes"]
forbidden_modules = [
    "app.api",
    "app.engine.registry",
    "app.engine.workflows",
]
