llm:
  model: "gpt-5.5"
  reasoning:
    effort: medium
    summary: auto
  verbosity: low
  temperature: 0.8
  streaming: true
  timeout: 600
  use_responses_api: true
  stream_usage: true
  model_kwargs:
    parallel_tool_calls: true
    tool_choice: auto
    context_management:
      - type: compaction
        compact_threshold: 100000

agents:
  researcher:
    system_prompt: ""

  summarizer:
    system_prompt: ""

  zettelkasten:
    system_prompt: ""
