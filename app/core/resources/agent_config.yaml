llm:
  model: "gpt-5.5"
  reasoning:
    effort: medium
    summary: auto
  verbosity: low
  temperature: 0.8
  streaming: true
  timeout: 600
  use_responses_api: true
  stream_usage: true
  model_kwargs:
    parallel_tool_calls: true
    tool_choice: auto

agents:
  researcher:
    # Override hook for the prompt defined in app/engine/agents/researcher.py.
    # Leave empty to use the default; set a string to override at runtime.
    system_prompt: ""

  summarizer:
    # Override hook for the prompt defined in app/engine/agents/summarizer.py.
    # Leave empty to use the default; set a string to override at runtime.
    system_prompt: ""

  zettelkasten:
    # Override hook for the prompt defined in app/engine/agents/zettelkasten.py.
    # Leave empty to use the default; set a string to override at runtime.
    system_prompt: ""
